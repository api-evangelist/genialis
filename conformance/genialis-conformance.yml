method: searched
source: >-
  https://www.genialis.com/compliance/ (certifications), plus derivation from
  openapi/genialis-base-openapi.yaml and the Auth0 OIDC discovery document at
  well-known/genialis-openid-configuration.json
api: Genialis Expressions API
cross_cutting:
- id: oauth2
  conforms: false
  evidence: >-
    The API itself declares exactly one security scheme — `cookieAuth` (apiKey in
    cookie, `sessionid`). No oauth2 securityScheme, no bearer token, no scopes. The
    only OAuth in the contract is OUTBOUND: /api/basespace/oauth_browse_url and
    /api/basespace/oauth_read_projects_url return URLs for requesting Illumina
    BaseSpace OAuth permissions, i.e. Genialis acting as an OAuth client against a
    third party, not as an authorization server.
- id: oidc
  conforms: partial
  evidence: >-
    Human sign-in is federated through the provider's own Auth0 tenant, which
    serves a complete OIDC discovery document at
    https://genialis.us.auth0.com/.well-known/openid-configuration (HTTP 200,
    issuer https://genialis.us.auth0.com/, PKCE S256 supported, RS256 id_tokens).
    The REST API does NOT accept OIDC tokens — it consumes the resulting Django
    session cookie. So OIDC is real for login and absent from the API contract.
- id: saml
  conforms: true
  evidence: >-
    Three first-class SAML endpoints in the contract: POST /saml-auth/api-login/,
    GET /saml-auth/remote-login/auth-id/ (cryptographically secure auth_id token),
    GET /saml-auth/remote-login/poll/. Enterprise SSO is a shipped capability, not
    a sales promise.
- id: rfc9457
  conforms: false
  evidence: >-
    No application/problem+json anywhere. Errors are bespoke ({"error": "..."} /
    {"detail": "..."}) and no error response is documented in the spec at all.
- id: pagination
  conforms: true
  evidence: >-
    RFC-free but consistent DRF limit/offset with count/next/previous/results.
    Verified live: GET /api/data?limit=1 -> count 29123 with absolute `next` URL.
- id: idempotency
  conforms: false
  evidence: No Idempotency-Key parameter in any of the 254 operations.
- id: json_api
  conforms: false
  evidence: Plain JSON, not JSON:API media type or envelope.
- id: odata
  conforms: false
- id: scim

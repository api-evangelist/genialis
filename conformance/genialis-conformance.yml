domain_standard:
  market: genomics / bioinformatics / precision oncology
  finding: >-
    The contract carries a genuine domain-standard signature in its data model, not
    just in prose. The variant surface is a faithful projection of the VCF v4.x
    call model plus the two canonical variant identifier schemes, and there is a
    JBrowse genome-adapter endpoint. This is what lets a bioinformatics consumer
    integrate without a bespoke connector.
  signatures:
  - standard: VCF (Variant Call Format) v4.x call model
    conforms: true
    confidence: high
    evidence:
      schema: components.schemas.Variant
      fields: [genome_assembly, chromosome, position, reference, alternative, species]
      schema_2: components.schemas.VariantCall
      fields_2: [quality, genotype_quality, depth, alternative_allele_depth, filter, genotype]
      note: >-
        CHROM/POS/REF/ALT/QUAL/FILTER and the GT/GQ/DP/AD FORMAT keys of VCF,
        surfaced one-for-one as REST fields on /api/variant, /api/variant_calls and
        /api/variant_experiment.
  - standard: NCBI dbSNP identifier scheme
    conforms: true
    confidence: high
    evidence:
      schema: components.schemas.VariantAnnotation
      field: dbsnp_id
  - standard: NCBI ClinVar identifier scheme + clinical significance vocabulary
    conforms: true
    confidence: high
    evidence:
      schema: components.schemas.VariantAnnotation
      fields: [clinvar_id, clinical_significance, clinical_diagnosis]
  - standard: JBrowse reference-sequence adapter
    conforms: true
    confidence: medium
    evidence:
      path: /api/_modules/jbrowse/genome
      operation_id: api__modules_jbrowse_genome_list
      description: Return JBrowse reference sequence.
  - standard: Illumina BaseSpace (de-facto sequencing-platform integration)
    conforms: true
    confidence: high
    evidence:
      paths: [/api/basespace/oauth_browse_url, /api/basespace/oauth_read_projects_url]
  probed_and_absent:
  - standard: GA4GH htsget
    conforms: false
    note: No /reads or /variants htsget surface.
  - standard: GA4GH DRS (Data Repository Service)
    conforms: false
    note: >-
      A data-object API exists (/api/data) but it is Resolwe-native, not the
      GA4GH /ga4gh/drs/v1 shape.
  - standard: GA4GH WES (Workflow Execution Service)
    conforms: false
    note: >-
      Closest analogue in the catalog. Genialis runs workflows through /api/process
      and /api/data with its own Resolwe process descriptors rather than the WES
      /runs contract — the single clearest bilateral-connector cost in this API for
      a consumer who already speaks GA4GH.
  - standard: GA4GH refget
    conforms: false

  objects; each Data object is the output of a Process run; DescriptorSchema defines
  the shape of the metadata descriptors attached to Collections, Samples and Data;
  AnnotationField/AnnotationValue carry structured sample metadata; Variant /
  VariantCall / VariantAnnotation carry the genomic call layer; Prediction* carry
  model outputs.

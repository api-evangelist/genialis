    path: /rest-auth/login/
    description: Attempt to perform automatic login.
  - id: rest_auth_logout_create
    method: POST
    path: /rest-auth/logout/
    description: Calls Django logout method and deletes the Token object assigned to the user.
  - id: rest_auth_user_retrieve
    method: GET
    path: /rest-auth/user/
    description: Reads and updates UserModel fields.
    use: cheapest way to verify a live session
  - id: rest_auth_password_change_create
    method: POST
    path: /rest-auth/password/change/
  - id: rest_auth_password_reset_create
    method: POST
    path: /rest-auth/password/reset/
  - id: rest_auth_password_reset_confirm_create
    method: POST
    path: /rest-auth/password/reset/confirm/
  gap: >-
    django-rest-auth endpoints are present in the contract but declare NO request
    body schema and NO error responses, so the credential field names are not
    discoverable from the spec and no failure mode is described.
- id: saml-sso
  documented: false
  operations:
  - id: saml_auth_api_login_create
    method: POST
    path: /saml-auth/api-login/
    description: Attempt to perform automatic login.
  - id: saml_auth_remote_login_auth_id_retrieve
    method: GET
    path: /saml-auth/remote-login/auth-id/
    description: Generate a cryptographically secure auth_id token.
  - id: saml_auth_remote_login_poll_retrieve
    method: GET
    path: /saml-auth/remote-login/poll/
    description: Poll the redis server for authentication data.
  note: >-
    A device-style pairing flow — mint an auth_id, send the user to the IdP, poll
    until the session materialises. This is the mechanism behind resdk's browser
    login and it is the enterprise SSO surface.
authorization:
  model: per-object ACL
  endpoints:
  - /api/data/{id}/permissions
  - /api/collection/{id}/permissions
  - /api/sample/{id}/permissions
  - /api/process/{id}/permissions
  - /api/descriptorschema/{id}/permissions
  principals: [user, group, public]
  scopes: none
outbound_oauth:
  note: >-
    Genialis acts as an OAuth CLIENT against Illumina BaseSpace:
    /api/basespace/oauth_browse_url and /api/basespace/oauth_read_projects_url return
    URLs for requesting BaseSpace permissions. This is not inbound API auth.
gaps:
- No machine-to-machine credential. There is no API key, no bearer token and no client_credentials path to the REST API — every documented route to a session requires a human at a browser.
- No 401/403 response is documented on any of the 254 operations.
- The /rest-auth/* operations have no request schema, so the login payload cannot be built from the contract.

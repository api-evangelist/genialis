flows:
- id: resdk-interactive
  documented: true
  docs: https://docs.genialis.com/resdk/start.html
  headless: false
  code: |
    import resdk
    res = resdk.Resolwe(url='https://app.genialis.com')
    res.login()          # performs interactive login in a web browser
    resdk.start_logging()
  note: >-
    The only flow Genialis documents. Quoted from the docs: "The `login()` call will
    perform interactive login in a web browser" and "If you omit the `login()` line
    you will be logged as anonymous user." An unattended agent cannot complete this
    without a human at a browser.
- id: rest-auth-session
  documented: false
  operations:
  - id: rest_auth_login_create

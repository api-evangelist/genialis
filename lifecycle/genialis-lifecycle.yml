  description: Return the minimal supported resdk version.
  finding: >-
    A machine-readable MINIMUM SUPPORTED CLIENT VERSION served by the platform
    itself, and it is the closest thing Genialis has to a deprecation mechanism: it
    lets the server tell a client it is too old, rather than failing opaquely. The
    resdk client is documented to check it. Probed anonymously on 2026-08-21 the
    path returned the SPA shell when requested with a browser Accept header, so the
    value could not be read without the client's own request shape; the endpoint is
    declared in the contract with security `[cookieAuth, {}]` (anonymous allowed).

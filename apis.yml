aid: genialis
name: Genialis
description: Genialis is a precision oncology company that builds AI models of cancer biology to find
  and validate biomarkers for drug developers. Its commercial platform, Genialis Expressions, is a multiomics
  and clinical data infrastructure for RNA-seq and related assays, and its Genialis Supermodel is a foundation
  model of cancer biology used for response prediction (krasID, adcID, DDR). The Expressions platform
  exposes a public Django REST Framework API at app.genialis.com covering data objects, samples, collections,
  processes, annotations, predictions and variants, published as a live OpenAPI 3.0.3 document, and is
  consumed programmatically through the open-source ReSDK Python client. Genialis also maintains the open-source
  Resolwe dataflow engine and Resolwe Bioinformatics pipelines that the platform is built on. Founded
  in Slovenia with offices in Boston, Houston and Ljubljana.

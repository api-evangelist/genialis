x-notes: 'No WellKnown pointer is emitted on purpose: no genialis.com host serves any /.well-known document.
  app.genialis.com answers 200 with an identical 1377-byte SPA shell for every path including a random
  control, and www/docs return honest 404s. The one real document found (OIDC discovery, saved to well-known/)
  is served by the provider''s Auth0 tenant, which is hosted-IdP boilerplate rather than a surface Genialis
  publishes. Likewise no MCPServer pointer (mcp/ holds a derived candidate, deployment mode none), no
  AgentCard (probe missed on every host), no Idempotency (the API has no idempotency key), and no StatusPage/Deprecation/Security
  (none published).'

notable:
- id: spa-catchall-masks-errors
  severity: high
  detail: >-
    Unmatched paths under https://app.genialis.com return 200 text/html (1377-byte
    React shell) instead of a 4xx. Confirmed on /api/zzznope, /api/data/999999999,
    /api/about/versions and /api/health_check. The `about` and `health_check`
    endpoints in the spec are served at the HOST ROOT (/about/versions,
    /health_check), not under /api — requesting them under /api silently returns
    HTML with a 200.
- id: path-prefix-split
  severity: medium
  detail: >-
    The spec's paths are server-root relative and use five different prefixes —
    /api/* (156 paths), /rest-auth/* (6), /about/* (3), /saml-auth/* (3) and
    /health_check (1). Because the spec declares no `servers[]`, a tool that
    assumes a single /api base will 200-with-HTML on the non-/api operations.

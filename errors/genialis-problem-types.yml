  finding: >-
    The published OpenAPI describes 254 operations and NOT ONE error response.
    Every operation lists only its success code. An agent reading this contract has
    no way to learn what a failure looks like, which status codes it must handle,
    or what shape the body will be. This is the single largest gap in the contract.
    The entries below are therefore PROBED from live responses and inferred from
    the Django REST Framework the API is built on — they are not published by
    Genialis, and are recorded as observations, not as a provider error reference.

        - logfc_threshold

        - prob_field

        - prob_threshold

        - up_regulated

        - down_regulated


        Request accepts any standard filter for Data objects, plus:

        - basket (optional)

        - source (optional)

        - species (optional)

        - filter_de_by_basket (optional)


        Response:

        - a list of data objects with additional calculated fields'

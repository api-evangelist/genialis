  /api/_modules/differential_expression/list:
    get:
      operationId: api__modules_differential_expression_list_list
      description: |-
        Endpoint used for differential expression data.

        Endpoint used for retrieving differential expression data objects
        that derive from samples in the basket. Data objects contain some
        additional fields that are being calculated on the database side.
        Those additional fields are:
         - logfc_threshold
         - prob_field
         - prob_threshold
         - up_regulated
         - down_regulated

        Request accepts any standard filter for Data objects, plus:
         - basket (optional)
         - source (optional)
         - species (optional)
         - filter_de_by_basket (optional)

        Response:
         - a list of data objects with additional calculated fields

        clinical_diagnosis:
          type: string
          nullable: true
        clinical_significance:
          type: string
          nullable: true
          maxLength: 100
        dbsnp_id:
          type: string
          nullable: true
          maxLength: 150
        clinvar_id:
          type: string
          nullable: true
          maxLength: 150
        transcripts:
          type: array
          items:
            $ref: '#/components/schemas/VariantTranscript'
      required:
      - id
      - variant_id
    VariantAnnotationTypeEnum:
      enum:
      - SNP
      - INDEL
      - MIXED
      - MNP
      - SYMBOLIC
      type: string
      description: |-
        * `SNP` - SNP
        * `INDEL` - INDEL
        * `MIXED` - MIXED
        * `MNP` - MNP
        * `SYMBOLIC` - SYMBOLIC
    VariantCall:
      type: object
      description: Serializer for VariantCall objects.
      properties:
        id:
          type: integer
          readOnly: true
        sample:
          type: integer
        variant:
          type: integer
          nullable: true
        experiment:
          type: integer
          nullable: true
        data:
          type: integer
          nullable: true
        quality:
          type: number
          format: double
          nullable: true
        genotype_quality:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        depth:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        depth_norm_quality:
          type: number
          format: double
          nullable: true
        alternative_allele_depth:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        filter:
          type: string
          nullable: true
          maxLength: 20
        genotype:
          type: string
          nullable: true
          maxLength: 3
      required:
      - id
      - sample
    VariantExperiment:
      type: object
      description: Serializer for VariantExperiment objects.
      properties:
        id:
          type: integer
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        contributor:
          $ref: '#/components/schemas/Contributor'
        variant_data_source:
          type: string
          maxLength: 100
      required:
      - contributor
      - id
      - timestamp
      - variant_data_source
    VariantTranscript:
      type: object
      description: Serializer for VariantAnnotationTranscript objects.
      properties:
        id:
          type: integer
          readOnly: true
        variant_annotation_id:
          type: integer
          readOnly: true
        annotation:
          type: string
        annotation_impact:
          type: string
          maxLength: 20
        gene:
          type: string
          maxLength: 100
        protein_impact:
          type: string
          maxLength: 100
        transcript_id:
          type: string
          maxLength: 200
        canonical:
          type: boolean
      required:
      - annotation
      - annotation_impact
      - gene
      - id
      - protein_impact
      - transcript_id
      - variant_annotation_id
    Versions:
      type: object
      properties:
        resolwe:
          type: string
          readOnly: true
        resolwe-bio:
          type: string
          readOnly: true
        genialis-bio:
          type: string
          readOnly: true
      required:
      - genialis-bio
      - resolwe
      - resolwe-bio
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

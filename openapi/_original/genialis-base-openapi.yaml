        * :drf:`Limit/Offset Pagination <pagination/#limitoffsetpagination>`
        * filtering by list of genes (significant genes for differential
          expression objects and list of included genes fot geneset objects)
        * filtering differential expressions by basket ids provided in
          ``filter_de_by_basket`` parameter
        * same filtering as Data endpoint (~`resolwe.flow.views.DataViewSet`)
        * ordering by ``-number_of_genes`` which is the default
        * same ordering as Data endpoint (~`resolwe.flow.views.DataViewSet`)

openapi: 3.2.0
info:
  title: Genialis base Kb API
  version: 0.0.0
  description: Backend of the Genialis platform.
servers:
- url: https://app.genialis.com
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: Kb
paths:
  /api/kb/feature:
    get:
      operationId: api_kb_feature_list
      description: 'Endpoint used for feature search.


        Request:

        - query

        - source

        - species

        - type

        - feature_id


        Response:

        - a list of matching features'
      parameters:
      - in: query
        name: feature_id
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: feature_id__in
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: query
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: source
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: species
        schema:
          type: array
          items:
            type: string
        description: Multiple values may be separated by commas.
        explode: false
        style: form
      - in: query
        name: type
        schema:
          type: string
          enum:
          - exon
          - gene
          - probe
          - transcript
        description: '* `gene` - Gene

          * `transcript` - Transcript

          * `exon` - Exon

          * `probe` - Probe'
      tags:
      - Kb
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFeatureList'
          description: ''
      summary: Api kb feature list
      x-summary-source: derived
    post:
      operationId: api_kb_feature_create
      description: Endpoint handler.
      tags:
      - Kb
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Feature'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Feature'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Feature'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
          description: ''
      summary: Api kb feature create
      x-summary-source: derived
  /api/kb/feature/paste:
    post:
      operationId: api_kb_feature_paste_create
      description: Endpoint used for exactly matching pasted genes.
      tags:

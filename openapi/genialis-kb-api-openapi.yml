components:
  schemas:
    PaginatedFeatureList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
    SubTypeEnum:
      enum:
      - protein-coding
      - pseudo
      - rRNA
      - ncRNA
      - snRNA
      - snoRNA
      - tRNA
      - asRNA
      - other
      - unknown
      type: string
      description: '* `protein-coding` - Protein-coding

        * `pseudo` - Pseudo

        * `rRNA` - rRNA

        * `ncRNA` - ncRNA

        * `snRNA` - snRNA

        * `snoRNA` - snoRNA

        * `tRNA` - tRNA

        * `asRNA` - asRNA

        * `other` - Other

        * `unknown` - Unknown'
    RelationTypeEnum:
      enum:
      - crossdb
      - ortholog
      - transcript
      - exon
      type: string
      description: '* `crossdb` - Crossdb

        * `ortholog` - Ortholog

        * `transcript` - Transcript

        * `exon` - Exon'
    FeatureTypeEnum:
      enum:
      - gene
      - transcript
      - exon
      - probe
      type: string
      description: '* `gene` - Gene

        * `transcript` - Transcript

        * `exon` - Exon

        * `probe` - Probe'
    Mapping:
      type: object
      description: Serializer for mapping.
      properties:
        id:
          type: integer
          readOnly: true
        relation_type:
          $ref: '#/components/schemas/RelationTypeEnum'
        source_db:
          type: string
          maxLength: 20
        source_id:
          type: string
          maxLength: 50
        source_species:
          type: string
          maxLength: 50
        target_db:
          type: string
          maxLength: 20
        target_id:
          type: string
          maxLength: 50
        target_species:
          type: string
          maxLength: 50
      required:
      - id
      - relation_type
      - source_db
      - source_id
      - source_species
      - target_db
      - target_id
      - target_species
    Feature:
      type: object
      description: Serializer for feature.
      properties:
        aliases:
          type: array
          items:
            type: string
            maxLength: 256
        description:
          type: string
        feature_id:
          type: string
          maxLength: 50
        full_name:
          type: string
          maxLength: 350
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 1024
        source:
          type: string
          maxLength: 20
        species:
          type: string
          maxLength: 50
        sub_type:
          $ref: '#/components/schemas/SubTypeEnum'
        type:
          $ref: '#/components/schemas/FeatureTypeEnum'
      required:
      - feature_id
      - id
      - name
      - source
      - species
      - sub_type
      - type
    PaginatedMappingList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Mapping'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

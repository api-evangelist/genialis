        label:
          type: string
          maxLength: 128
        required:
          type: boolean
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

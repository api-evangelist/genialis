openapi: 3.2.0
info:
  title: Genialis base Health Check API
  version: 0.0.0
  description: Backend of the Genialis platform.
servers:
- url: https://app.genialis.com
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: health_check
paths:
  /health_check:
    get:
      operationId: health_check_retrieve
      description: Perform database and redis health check.
      tags:
      - health_check
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid

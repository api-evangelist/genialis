gaps:
- The REST API contract itself is unversioned and its `info.version` is the drf-spectacular default `0.0.0`, so a changelog entry cannot be tied to a contract version.
- No changelog, release-notes or status page exists on a genialis.com host; a consumer has to know to read GitHub.

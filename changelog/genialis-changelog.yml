note: >-
  Genialis publishes no changelog on www.genialis.com or docs.genialis.com — both
  return 404 for /changelog, /releases and /status. What it DOES publish is a
  Keep-a-Changelog-style, dated, semver changelog for the two components the
  platform is built from, in the open-source repositories that back the API:
  `resolwe` (the dataflow engine that serves this API) and `resdk` (the Python
  client). The live platform reports the same versions at GET /about/versions
  (resolwe 45.1.0, resolwe-bio 65.0.0), so these changelogs describe the deployed
  API, not a separate product. That is the change record a consumer of this API
  actually has.
